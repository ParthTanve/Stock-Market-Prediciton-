<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FinAI Stock Market Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        
        body {
            background-color: #000000; 
            color: #f8f9fa; 
            min-height: 100vh;
            display: flex; 
            font-family: 'Inter', sans-serif;
            margin: 0; 
        }

        .sidebar {
            width: 250px;
            min-width: 250px;
            background-color: #1a1a1a; 
            padding: 20px;
            position: fixed; 
            height: 100vh;
            box-shadow: 2px 0 10px rgba(0, 255, 255, 0.1); 
            z-index: 10; 
        }
        
        .sidebar-link {
            cursor: pointer;
            color: #cccccc;
            padding: 10px 15px;
            margin-bottom: 8px;
            border-radius: 8px;
            transition: all 0.2s;
            font-weight: 500;
            display: block;
        }
        .sidebar-link:hover, .sidebar-link.active {
            background-color: #333333;
            color: #00aaff; 
            box-shadow: 0 0 5px rgba(0, 170, 255, 0.3);
        }

        #main-content {
            margin-left: 250px; 
            padding: 30px;
            flex-grow: 1;
            width: calc(100% - 250px);
            min-height: 100vh; 
        }
        
        .card-prediction {
            background-color: #121212;
            color: #ffffff; 
            border: 1px solid #333333; 
            border-radius: 16px; 
            box-shadow: 0 5px 15px rgba(0, 200, 255, 0.3); 
            transition: transform 0.3s;
        }
        .form-control {
            background-color: #222222; 
            color: #ffffff;
            border: 1px solid #444444;
        }
        .btn-predict {
            background-color: #00cc66; 
            border-color: #00cc66;
            color: #000000;
            font-weight: bold;
        }

        .chart-container {
            height: 50vh; 
            min-height: 300px;
            width: 100%;
        }

        .video-background {
            position: fixed; 
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            z-index: -1; 
        }

        .video-background video {
            min-width: 100%;
            min-height: 100%;
            width: auto;
            height: auto;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            object-fit: cover;
            filter: brightness(0.2) blur(1px); 
        }

        
#home-template > .p-4 {
    min-height: calc(100vh - 60px); 
    
    display: flex;
    align-items: center;    
    justify-content: center; 
    text-align: center;
}
        .animated-heading {
            font-size: 3.5rem; 
            letter-spacing: 5px;
            color: #ffffff; 
            text-shadow: 
                0 0 10px rgba(0, 170, 255, 0.5), 
                0 0 20px rgba(0, 170, 255, 0.5);
            animation: neon-glow 1.5s ease-in-out infinite alternate;
            padding: 15px 30px; 
            border: 2px solid #00aaff;
            border-radius: 10px;
            background-color: rgba(0, 0, 0, 0.7); 
            margin: 0; 
        }

        @keyframes neon-glow {
            from {
                text-shadow: 
                    0 0 5px #fff,
                    0 0 10px #00aaff, 
                    0 0 20px #ff0077, 
                    0 0 30px #00aaff;
                border-color: #00aaff;
            }
            to {
                text-shadow: 
                    0 0 7px #fff,
                    0 0 15px #00aaff, 
                    0 0 25px #ff0077, 
                    0 0 40px #ff0077;
                border-color: #ff0077;
            }
        }


        @media (max-width: 768px) {
            .sidebar {
                width: 100%;
                height: auto;
                position: relative;
                box-shadow: 0 2px 10px rgba(0, 255, 255, 0.1);
                margin-bottom: 20px;
            }
            #main-content {
                margin-left: 0;
                padding-top: 10px;
                width: 100%;
            }
            .sidebar-link {
                display: inline-block;
                width: auto;
            }
            .animated-heading {
                font-size: 2rem;
            }
        }
    </style>
</head>
<body>
    
    <div class="video-background">
        <video autoplay loop muted playsinline>
            <source src="video_preview_h264.mp4" type="video/mp4">
            Your browser does not support the video tag.
        </video>
    </div>

    <div class="sidebar">
        <h3 class="text-center text-primary mb-5"> Dashboard</h3>
        <nav id="sidebar-nav">
            <a class="sidebar-link active" data-page="home"> Home</a>
            <a class="sidebar-link" data-page="analysis" id="link-analysis"> Stock Analysis</a>
            <a class="sidebar-link" data-page="prediction"> Price Prediction</a>
        </nav>
    </div>

    <main id="main-content" class="container-fluid">
        </main>

    <template id="home-template">
        <div class="p-4">
            <h1 class="animated-heading">WELCOME TO STOCK PRICE PREDICTION</h1>
        </div>
    </template>

    <template id="analysis-template">
        <div class="p-4">
            <h1 class="text-white mb-4 border-bottom pb-2">Stock Analysis: The Beginner's Guide</h1>
            <p class="lead text-muted">Understanding the difference between why a stock is valuable and when to trade it.</p>

            <div class="row mt-5 g-4">
                <div class="col-md-6">
                    <div class="card card-prediction p-4 h-100">
                        <h4 class="text-success mb-3"> Fundamental Analysis</h4>
                        <p><strong>The "Why?" (Intrinsic Value, Long-Term View)</strong></p>
                        <p class="text-sm text-muted">Fundamental analysis assesses a company's true worth (intrinsic value) by diving into its underlying business and economic factors. It is primarily used for <strong>long-term investment</strong> ("buy and hold").</p>
                        <ul class="list-unstyled mt-3">
                            <li> Focuses on: Financial Statements, Earnings (EPS), Revenue, Debt/Assets, Industry Trends, Management Quality.</li>
                            <li> Key Ratios: P/E (Price-to-Earnings), P/B (Price-to-Book), ROE (Return on Equity).</li>
                        </ul>
                    </div>
                </div>
                <div class="col-md-6">
                    <div class="card card-prediction p-4 h-100">
                        <h4 class="text-success mb-3"> Technical Analysis</h4>
                        <p><strong>The "When?" (Price Trends, Short-Term View)</strong></p>
                        <p class="text-sm text-muted">Technical analysis evaluates assets by reviewing historical price and volume data. It assumes all known information is already reflected in the market price and is best suited for <strong>short-term trading</strong>.</p>
                        <ul class="list-unstyled mt-3">
                            <li> Focuses on: Price Patterns, Trading Volume, Support/Resistance Levels, Market Psychology.</li>
                            <li> Key Tools: Moving Averages (MA), RSI (Relative Strength Index), MACD (Moving Average Convergence Divergence), Candlestick patterns.</li>
                        </ul>
                    </div>
                </div>
            </div>
            <div class="card card-prediction p-4 mt-4">
                <h4 class="text-warning mb-3">Best Practice: Combine Both</h4>
                <p>For the most comprehensive strategy, experienced investors often combine Fundamental Analysis (to choose what to buy) and Technical Analysis (to determine when to buy or sell).</p>
            </div>
        </div>
    </template>

    <template id="prediction-template">
        <div class="container-fluid px-0">
            <h1 class="text-white mb-4 border-bottom pb-2">AI Stock Price Prediction </h1>
            
            <div class="card card-prediction p-4 mb-4">
                <h4 class="card-title text-primary">Model Parameters</h4>
                <form id="prediction-form" class="row g-3 align-items-end">
                    <div class="col-lg-3 col-md-6 col-sm-12">
                        <label for="ticker" class="form-label">Stock Ticker (e.g., AAL)</label>
                        <input type="text" class="form-control form-control-sm" id="ticker" value="AAL" required>
                    </div>
                    <div class="col-lg-3 col-md-6 col-sm-12">
                        <label for="epochs" class="form-label">Epochs (Training Cycles)</label>
                        <input type="number" class="form-control form-control-sm" id="epochs" value="30" min="1" required>
                    </div>
                    <div class="col-lg-3 col-md-6 col-sm-12">
                        <label for="lookback" class="form-label">Lookback Window (num_unrollings)</label>
                        <input type="number" class="form-control form-control-sm" id="lookback" value="50" min="10" required>
                    </div>
                    <div class="col-lg-3 col-md-6 col-sm-12 d-grid">
                        <button type="submit" class="btn btn-predict btn-sm">Run Prediction</button>
                    </div>
                </form>
            </div>
    
            <div class="card card-prediction p-4">
                <h4 class="card-title text-success mb-3">Prediction Results</h4>
                
                <div id="loading-spinner" class="text-center d-none">
                    <div class="spinner-border text-primary" role="status">
                        <span class="visually-hidden">Loading...</span>
                    </div>
                    <p class="mt-2 text-muted">Training LSTM Model and generating forecast...</p>
                </div>
    
                <div class="chart-container">
                    <canvas id="stockChart"></canvas> 
                </div>
                
                <div class="mt-3">
                    <p><strong>Status:</strong> <span id="status-message" class="text-muted">Enter parameters and click 'Run Prediction' to begin.</span></p>
                    <p><strong>Model Performance (MSE):</strong> <span id="mse-result" class="text-danger">--</span></p>
                </div>
            </div>
        </div>
    </template>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <script src="app.js"></script>

</body>
</html>
